# Root Compose file — the canonical entrypoint for the whole environment.
#
# `include` pulls the backend stack into THIS project, so every service shares
# one default network: `next-frontend` can reach the API at `http://nestjs-api:3000`.
# Running `docker compose up` from inside `nestjs-project/` instead would create a
# separate project on a separate network, and that name would not resolve.
#
# Paths inside the included file stay relative to `nestjs-project/`, so the
# backend Compose file needs no changes.
include:
  - nestjs-project/compose.yaml

services:
  next-frontend:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile.dev
    ports:
      - 3001:3001
    volumes:
      - ./next-frontend:/home/node/app
    # No `env_file` on purpose. `next-frontend/.env` is loaded by `@next/env` —
    # by `next build`/`next dev`/`next start`, by `vitest.config.mts`, and by
    # `playwright.config.ts`, each calling `loadEnvConfig` itself. Injecting the
    # same file as container environment would *shadow* that cascade: the Next
    # loader never overwrites a variable already present in `process.env`, so
    # `.env.test` would stop applying and the Vitest env suite would read the
    # development value instead of its own.
    depends_on:
      - nestjs-api
